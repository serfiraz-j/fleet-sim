services:
  emqx:
    image: emqx/emqx:5.9.0

    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:18083:18083"
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s